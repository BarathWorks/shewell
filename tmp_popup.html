<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Session Details | Shewell Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0d4759",
                        "surface": "#f8f9ff",
                        "surface-container-low": "#eff4ff",
                        "on-surface": "#0b1c30",
                        "on-surface-variant": "#40484b",
                        "outline": "#71787c",
                        "outline-variant": "#c0c8cc",
                        "brand": "#00898f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "sm": "16px",
                        "md": "24px",
                        "lg": "32px",
                        "xl": "48px"
                    },
                    "fontFamily": {
                        "headline": ["Hanken Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
        body {
            background-color: #eff4ff; /* surface-container-low per request */
        }
        .modal-shadow {
            box-shadow: 0 20px 50px rgba(11, 28, 48, 0.12);
        }
        .custom-input {
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: #00898f;
            box-shadow: 0 0 0 3px rgba(0, 137, 143, 0.1);
        }
    </style>
</head>
<body class="font-body text-on-surface flex items-center justify-center min-h-screen p-md">
<!-- Modal Container -->
<div class="bg-white w-full max-w-[560px] rounded-2xl modal-shadow overflow-hidden flex flex-col border border-outline-variant/20">
<!-- Header -->
<div class="px-lg pt-lg pb-md flex items-center justify-between">
<h2 class="text-[20px] font-headline font-bold text-on-surface">Session Details</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content -->
<div class="px-lg pb-lg flex flex-col gap-md">
<!-- Max Bookings -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] font-semibold text-on-surface-variant">Max Bookings</label>
<input class="custom-input w-full bg-white border border-outline-variant/60 rounded-xl px-4 py-2.5 text-[14px] outline-none placeholder:text-outline-variant" placeholder="Unlimited" type="text"/>
</div>
<!-- Meeting Link -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] font-semibold text-on-surface-variant">Meeting Link</label>
<input class="custom-input w-full bg-white border border-outline-variant/60 rounded-xl px-4 py-2.5 text-[14px] outline-none placeholder:text-outline-variant" placeholder="https://zoom.us/j/..." type="url"/>
</div>
<!-- Overview -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] font-semibold text-on-surface-variant">Overview</label>
<textarea class="custom-input w-full bg-white border border-outline-variant/60 rounded-xl px-4 py-2.5 text-[14px] outline-none placeholder:text-outline-variant resize-none" placeholder="Provide a detailed description of the session..." rows="4"></textarea>
</div>
<!-- Image Uploads -->
<div class="grid grid-cols-2 gap-md">
<!-- Thumbnail -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] font-semibold text-on-surface-variant">Thumbnail Image</label>
<button class="w-full h-[88px] flex flex-col items-center justify-center gap-1.5 border border-dashed border-outline-variant/60 rounded-xl hover:bg-surface/50 hover:border-brand/40 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">add_photo_alternate</span>
<span class="text-[12px] font-medium">Choose Image</span>
</button>
</div>
<!-- Banners -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-[13px] font-semibold text-on-surface-variant">Banner Images</label>
<span class="text-[11px] text-outline">Max 2</span>
</div>
<button class="w-full h-[88px] flex flex-col items-center justify-center gap-1.5 border border-dashed border-outline-variant/60 rounded-xl hover:bg-surface/50 hover:border-brand/40 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">collections</span>
<span class="text-[12px] font-medium">Add Banners</span>
</button>
</div>
</div>
</div>
<!-- Footer -->
<div class="px-lg py-md bg-surface/50 border-t border-outline-variant/20 flex items-center justify-end gap-sm">
<button class="px-5 py-2.5 text-[14px] font-semibold text-on-surface-variant hover:text-on-surface transition-colors">
                Cancel
            </button>
<button class="px-8 py-2.5 bg-[#00898f] hover:bg-[#007a7f] text-white text-[14px] font-bold rounded-xl shadow-sm transition-all active:scale-[0.98]">
                Save Changes
            </button>
</div>
</div>
</body></html>
