<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Rounded Square Backdrop (Soft Teal Tint) -->
  <rect width="512" height="512" rx="64" fill="#EBF5F5"/>

  <!-- Calendar Main Body Container -->
  <rect x="130" y="128" width="252" height="264" rx="36" fill="#F4F9F9" stroke="#00898F" stroke-width="12"/>

  <!-- Calendar Top Header Bar (Shewell Brand Teal) -->
  <path d="M130 164C130 144.118 146.118 128 166 128H346C365.882 128 382 144.118 382 164V196H130V164Z" fill="#00898F"/>

  <!-- Ring Binder Hooks (Dark Shewell Teal) -->
  <rect x="176" y="110" width="18" height="50" rx="9" fill="#006C70" stroke="#EBF5F5" stroke-width="4"/>
  <rect x="318" y="110" width="18" height="50" rx="9" fill="#006C70" stroke="#EBF5F5" stroke-width="4"/>

  <!-- Grid Dots (Row 1) -->
  <circle cx="192" cy="232" r="11" fill="#006C70"/>
  <circle cx="234" cy="232" r="11" fill="#006C70"/>
  <circle cx="276" cy="232" r="11" fill="#006C70"/>
  <circle cx="318" cy="232" r="11" fill="#006C70"/>

  <!-- Grid Dots (Row 2) -->
  <circle cx="192" cy="272" r="11" fill="#006C70"/>
  <circle cx="234" cy="272" r="11" fill="#006C70"/>
  <circle cx="276" cy="272" r="11" fill="#006C70"/>
  <circle cx="318" cy="272" r="11" fill="#006C70"/>

  <!-- Grid Dots (Row 3) -->
  <circle cx="192" cy="312" r="11" fill="#006C70"/>
  <circle cx="234" cy="312" r="11" fill="#006C70"/>
  <circle cx="276" cy="312" r="11" fill="#006C70"/>

  <!-- Magnifying Glass with Chart Overlay -->
  <g transform="translate(268, 276)">
