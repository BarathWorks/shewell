    <circle cx="44" cy="44" r="36" fill="#D8EFEF" stroke="#006C70" stroke-width="10"/>

    <!-- Chart Line & Nodes inside Lens -->
    <path d="M22 48 L32 40 L44 48 L62 32" stroke="#006C70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="48" r="4" fill="#006C70"/>
    <circle cx="32" cy="40" r="4" fill="#006C70"/>
    <circle cx="44" cy="48" r="4" fill="#006C70"/>
    <circle cx="62" cy="32" r="4" fill="#006C70"/>

    <!-- Handle -->
    <line x1="68" y1="68" x2="88" y2="88" stroke="#006C70" stroke-width="12" stroke-linecap="round"/>
  </g>
